[package]
name = "wazuh-dac"
version = "0.1.0"
edition = "2024"
authors = ["Jeff Scollick"]
license = "MIT"
description = "Sigma detection-as-code for Wazuh 5.0, tested against the real engine"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.10", features = ["derive"] }
ipnet = "2.12.2"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"
thiserror = "2.0.21"
ureq = { version = "3.5.2", features = ["json"] }
