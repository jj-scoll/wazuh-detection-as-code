title: AWS CloudTrail logging stopped or trail deleted
id: 0b91c9cb-2f95-4a2b-8d97-6c503de612e1
status: experimental
description: >
  A CloudTrail trail was stopped, deleted, or had its event selectors changed.
  Turning off the audit trail is a common first step before further actions
  in an AWS account.
references:
  - https://attack.mitre.org/techniques/T1562/008/
  - https://docs.aws.amazon.com/awscloudtrail/latest/APIReference/API_StopLogging.html
author: Jeff Scollick
date: 2026-11-24
tags:
  - attack.defense-evasion
  - attack.t1562.008
logsource:
  product: aws
  service: cloudtrail
detection:
  # ECS mapping of CloudTrail: eventSource -> event.provider, eventName -> event.action.
  selection:
    cloud.provider: aws
    event.provider: cloudtrail.amazonaws.com
    event.action:
      - StopLogging
      - DeleteTrail
      - PutEventSelectors
  condition: selection
falsepositives:
  - Planned trail migrations by the cloud platform team
level: high
