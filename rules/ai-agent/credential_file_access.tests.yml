match:
  - description: Read tool blocked on a credential file
    event:
      event: {kind: event, category: [intrusion_detection], provider: guardrails, dataset: guardrails.decisions, action: block}
      rule: {name: 'secret-file:Read', ruleset: guardrails}
      observer: {product: guardrails, vendor: broodhall, version: 1.12.1}
      host: {name: dev-laptop}
      user: {name: dev}
      labels: {session_id: 7f1c2a9e-4b1d-4c55-9a70-0d3e5b8f2c11}
  - description: Shell program reading a secret file asked about
    event:
      event: {provider: guardrails, action: ask}
      rule: {name: 'secret-file:cat', ruleset: guardrails}
  - description: Bash read of a secret file masked
    event:
      event: {provider: guardrails, action: mask}
      rule: {name: secret-mask, ruleset: guardrails}
no_match:
  - description: Large-read block is not about credentials
    event:
      event: {provider: guardrails, action: block}
      rule: {name: large-read, ruleset: guardrails}
  - description: Same rule name from a different product
    event:
      event: {provider: other-scanner, action: block}
      rule: {name: 'secret-file:Read', ruleset: other}
  - description: Prefix must be at the start
    event:
      event: {provider: guardrails, action: ask}
      rule: {name: 'not-secret-file:cat', ruleset: guardrails}
