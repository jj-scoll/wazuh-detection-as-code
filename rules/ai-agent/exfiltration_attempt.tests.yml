match:
  - description: Secret found in an outbound request
    event:
      event: {provider: guardrails, action: ask}
      rule: {name: 'egress:secret', ruleset: guardrails}
  - description: Literal GitHub token in a command, observe mode let it through
    event:
      event: {provider: guardrails, action: would-ask}
      rule: {name: 'secret-arg:github-token', ruleset: guardrails}
  - description: Outside email address in a web fetch URL
    event:
      event: {provider: guardrails, action: ask}
      rule: {name: 'egress:email', ruleset: guardrails}
no_match:
  - description: Re-read nudge
    event:
      event: {provider: guardrails, action: nudge}
      rule: {name: read-dedup, ruleset: guardrails}
  - description: Egress rule mentioned by another product
    event:
      event: {provider: proxy, action: ask}
      rule: {name: 'egress:secret', ruleset: proxy}
