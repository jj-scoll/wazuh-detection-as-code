title: AI coding agent reached for a credential file
id: d4e96a90-f6c4-4267-b8c6-e021eb584acc
status: experimental
description: >
  broodhall guardrails stopped, masked or questioned an AI coding agent's
  attempt to read or edit a credential file (cloud keys, SSH keys, .env, the
  agent's own token store). One event can be a legitimate task; a burst, or
  one in a session that just read untrusted content, suggests indirect prompt
  injection steering the agent toward secrets.
references:
  - https://github.com/jj-scoll/broodhall/blob/main/THREAT_MODEL.md
  - https://atlas.mitre.org/techniques/AML.T0083
author: Jeff Scollick
date: 2026-11-25
tags:
  - attack.credential-access
  - attack.t1552.001
  - atlas.aml.t0055
  - atlas.aml.t0083
  - owasp.llm02
  - broodhall.t06
logsource:
  product: claude-code
  service: guardrails
detection:
  selection_source:
    event.provider: guardrails
    rule.ruleset: guardrails
  selection_rule:
    - rule.name|startswith: 'secret-file:'
    - rule.name: secret-mask
  selection_decision:
    event.action: [block, ask, mask]
  condition: all of selection_*
falsepositives:
  - A developer asking the agent to debug their own cloud or SSH configuration
level: medium
