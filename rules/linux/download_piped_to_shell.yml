title: Remote script downloaded and piped straight into a shell
id: 73574728-80d3-4e27-9d98-8af76383d0ff
status: experimental
description: >
  curl or wget output is piped directly into a shell interpreter, so the
  fetched script runs without ever touching disk for review.
references:
  - https://attack.mitre.org/techniques/T1105/
  - https://attack.mitre.org/techniques/T1059/004/
author: Jeff Scollick
date: 2026-11-24
tags:
  - attack.command-and-control
  - attack.execution
  - attack.t1105
  - attack.t1059.004
logsource:
  product: linux
  category: process_creation
detection:
  selection_download:
    process.command_line|contains:
      - 'curl '
      - 'wget '
  # Wazuh |re has no \s, no escapes and no usable `/`, so: character classes,
  # and an optional path prefix that must end in a non-alphanumeric (the `/`
  # of /bin/bash) so `| fish` and `| sshpass` don't match. The shell name must
  # be followed by a space or the end of the line.
  selection_pipe_to_shell:
    process.command_line|re: '[|][ ]*(sudo[ ]+)?([^ ]*[^ a-zA-Z0-9])?(ba|da|z|k)?sh([ ].*)?$'
  condition: selection_download and selection_pipe_to_shell
falsepositives:
  - Vendor install one-liners run by administrators (still worth a look)
level: medium
