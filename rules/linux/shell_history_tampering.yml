title: Shell history cleared or disabled
id: 10d94d75-004b-4a0e-aa9f-6934a1776ff2
status: experimental
description: >
  A command clears, truncates or disables shell history, or a history file is
  deleted. Intruders do this to hide the commands they ran.
references:
  - https://attack.mitre.org/techniques/T1070/003/
author: Jeff Scollick
date: 2026-11-24
tags:
  - attack.defense-evasion
  - attack.t1070.003
logsource:
  product: linux
detection:
  selection_command:
    process.command_line|contains:
      - 'history -c'
      - 'unset HISTFILE'
      - 'HISTFILE=/dev/null'
      - 'HISTSIZE=0'
      - 'HISTFILESIZE=0'
      - 'set +o history'
  selection_file_deleted:
    event.category: file
    event.type: deletion
    file.name:
      - .bash_history
      - .zsh_history
      - .ash_history
  condition: 1 of selection_*
falsepositives:
  - Users deliberately clearing their own history
level: medium
